<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>約會選擇券 💕 即時地圖版</title>
<link rel="preconnect" href="https://unpkg.com">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#FFF3F6;--card:#fff;--ink:#5B3A4A;--sub:#A07F8D;--pink:#FF7FA3;--pink2:#FFD3E0;--mint:#CDF3E4;--butter:#FFF0B3;--lav:#E6DBFF;--line:#FFC2D4;color-scheme:light}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg) radial-gradient(var(--line) 1.5px,transparent 1.5px) 0 0/26px 26px;color:var(--ink);font-family:'Zen Maru Gothic','PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;font-weight:500;overflow-x:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:center;gap:12px}
.mas{font-size:56px;line-height:1;background:var(--card);border:3px solid var(--line);border-radius:50%;width:84px;height:84px;display:grid;place-items:center;flex:none;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
.bub{position:relative;background:var(--card);border:3px solid var(--line);border-radius:20px;padding:10px 14px;font-weight:700;font-size:15px;line-height:1.5}
.bub::before{content:"";position:absolute;left:-10px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:var(--line);border-left:0}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}}
#prog{display:flex;justify-content:center;gap:6px;margin:16px 0 10px;font-size:20px;color:var(--pink)}
#prog .cur{animation:pop .6s}
#prog span{opacity:.45}#prog .done,#prog .cur{opacity:1}
.panel{background:var(--card);border:3px solid var(--line);border-radius:28px;padding:20px 16px;box-shadow:0 6px 0 var(--line)}
.panel.in{animation:slide .35s}
@keyframes slide{from{opacity:0;transform:translateX(24px)}}
h1{font-size:23px;font-weight:900;margin:0 0 4px;line-height:1.35}
.hint{margin:0 0 14px;color:var(--sub);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{position:relative;text-align:left;font:inherit;color:inherit;background:var(--card);border:3px solid var(--line);border-radius:20px;padding:12px;cursor:pointer;box-shadow:0 4px 0 var(--line);transition:transform .12s,box-shadow .12s,background .2s;display:flex;flex-direction:column;gap:2px;min-height:112px}
.opt:active{transform:translateY(4px);box-shadow:0 0 0 var(--line)}
.opt i{font-style:normal;font-size:28px;width:46px;height:46px;border-radius:16px;display:grid;place-items:center;margin-bottom:4px}
.c0 i{background:var(--butter)}.c1 i{background:var(--mint)}.c2 i{background:var(--lav)}.c3 i{background:var(--pink2)}
.opt b{font-size:16px;font-weight:900}.opt small{color:var(--sub);font-size:12.5px;line-height:1.4}
.opt.on{background:var(--pink2);border-color:var(--pink);box-shadow:0 4px 0 var(--pink);animation:wig .4s}
.opt.on::after{content:"♥";position:absolute;right:10px;top:8px;color:var(--pink);font-size:18px}
@keyframes wig{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
.dt{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px;font-weight:700;font-size:14px}
input{font:inherit;color:var(--ink);background:var(--bg);border:3px solid var(--line);border-radius:14px;padding:6px 10px}
input:focus-visible,button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
nav{display:flex;gap:10px;margin-top:18px}
nav[hidden]{display:none}
.btn{font:inherit;font-weight:900;font-size:16px;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:999px;padding:12px 18px;cursor:pointer;box-shadow:0 4px 0 var(--line);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn.main{background:var(--pink);border-color:var(--pink);color:#fff;box-shadow:0 4px 0 #D9577C;flex:1}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{font-size:13px;padding:8px 12px;box-shadow:0 3px 0 var(--line)}
.ticket{position:relative;border:3px dashed var(--pink);border-radius:24px;padding:18px 16px;background:var(--bg)}
.tt{font-size:24px;font-weight:900;text-align:center}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 12px}
dt{font-weight:900;color:var(--pink);white-space:nowrap}dd{margin:0;line-height:1.5}
.fine{margin:14px 0 0;text-align:center;color:var(--sub);font-size:13px}
.ans{position:relative;display:flex;justify-content:center;gap:14px;margin:20px 0 6px;min-height:64px;align-items:center}
.ans .btn{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.tools{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;z-index:999}
#toast.show{opacity:1;transform:translate(-50%,0)}
.fl{position:fixed;pointer-events:none;z-index:1200;font-size:22px;animation:fl 1s ease-out forwards}
@keyframes fl{to{transform:translate(var(--dx),var(--dy)) scale(1.4) rotate(40deg);opacity:0}}
.rs label{display:block;font-weight:700;font-size:14px;margin-top:14px}
.rs input{display:block;width:100%;margin-top:6px}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.links a{text-align:center;text-decoration:none;font-size:14px;padding:10px 8px;color:var(--ink)}
.st{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:0 0 14px}
.chip{background:var(--bg);border:3px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px}
.chip.ok{background:var(--mint);border-color:var(--mint)}
.wait{font-size:64px;text-align:center;margin:20px 0;animation:bob 2.6s ease-in-out infinite}
.cap{margin:8px 2px 10px;color:var(--sub);font-size:12.5px;line-height:1.5}
.rl{display:grid;gap:8px}
.ri{display:grid;grid-template-columns:34px 1fr;gap:2px 10px;text-align:left;font:inherit;color:inherit;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:10px 12px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.ri .no{grid-row:1/4;align-self:center;width:30px;height:30px;border-radius:50%;background:var(--pink2);display:grid;place-items:center;font-weight:900}
.ri .rn{font-weight:900;font-size:15px}.ri .rm{font-size:13px}.ri small{color:var(--sub);font-size:12.5px}
.ri em{font-style:normal;background:var(--butter);border-radius:999px;padding:1px 8px;margin-left:6px;font-size:12px}
.ri.on{background:var(--pink2);border-color:var(--pink);box-shadow:0 3px 0 var(--pink)}.ri.on .no{background:var(--pink);color:#fff}
.ri .rt{font-size:11px;font-weight:900;color:var(--pink)}
details.more{margin-top:14px}details.more summary{cursor:pointer;font-weight:700;font-size:14px}

/* ---- 餐廳搜尋：表單 / 進度 ---- */
.grp{margin:12px 2px 6px;font-weight:900;font-size:13px;color:var(--sub);display:flex;align-items:center;gap:6px}
.sum{display:flex;flex-wrap:wrap;gap:8px;margin:10px 2px 2px}
.sum span{background:var(--mint);border:2px solid var(--mint);border-radius:999px;padding:3px 10px;font-weight:900;font-size:12.5px}
.sum span.g{background:var(--butter);border-color:var(--butter)}
.sum span.p{background:var(--lav);border-color:var(--lav)}
.bar2{height:7px;border-radius:999px;background:var(--pink2);overflow:hidden;margin:10px 2px 0}
.bar2 i{display:block;height:100%;width:0;background:var(--pink);transition:width .35s}
.bar2[hidden]{display:none}
.ri.hit{border-color:var(--pink)}
.ri .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.ri em.hitb{background:var(--mint);border:2px solid var(--mint);color:#2C6B51}
.ri em.db{background:var(--butter)}
.ri em.tb{background:var(--lav)}
.ri em.oh{background:var(--bg);border:2px solid var(--line)}

/* ---- 分步重選 ---- */
.rsm{display:grid;gap:8px}
.rst{display:flex;align-items:center;gap:10px;text-align:left;font:inherit;color:inherit;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:10px 12px;cursor:pointer;box-shadow:0 3px 0 var(--line);transition:transform .12s,box-shadow .12s}
.rst:active{transform:translateY(3px);box-shadow:none}
.rst .step{width:26px;height:26px;flex:none;border-radius:50%;background:var(--pink2);display:grid;place-items:center;font-weight:900;font-size:13px}
.rst .rn2{font-weight:900;font-size:14.5px;flex:1;min-width:0}
.rst .rv2{color:var(--sub);font-size:12.5px;flex:none;max-width:44%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- 即時地圖 ---- */
.lmap{height:300px;border:3px solid var(--line);border-radius:20px;overflow:hidden;background:var(--mint);margin-top:14px;position:relative}
.lmap svg{display:block;width:100%;height:auto}
.mapbg{fill:var(--mint)}.pk{fill:var(--butter)}.rd{stroke:var(--card);fill:none;stroke-width:9;stroke-linecap:round}
.pin{cursor:pointer}.pin circle{fill:var(--card);stroke:var(--pink);stroke-width:3}
.pin text{fill:var(--ink);font-size:12px;font-weight:900;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pin.on circle{fill:var(--pink);stroke:var(--card)}.pin.on text{fill:#fff}
.mapbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.numpin{width:28px;height:28px;border-radius:50%;background:var(--card);border:3px solid var(--pink);display:grid;place-items:center;font-weight:900;font-size:13px;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.18);transition:transform .15s}
.numpin.on{background:var(--pink);color:#fff;border-color:var(--card);transform:scale(1.18)}
.me{width:30px;height:30px;border-radius:50%;background:var(--lav);border:3px solid var(--card);display:grid;place-items:center;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.leaflet-container{font:inherit;background:var(--mint)}
.leaflet-popup-content{margin:10px 12px;font-size:13px;line-height:1.5;font-weight:700;color:var(--ink)}
.leaflet-popup-content b{font-size:14px}
.leaflet-popup-content-wrapper{border-radius:16px;border:3px solid var(--line)}
.leaflet-bar a{border-radius:8px!important;color:#5B3A4A}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* --- WGS84 <-> GCJ02：高德圖磚是火星坐標，標點要轉換才不會偏移 --- */
const _PI=Math.PI,_A=6378245.0,_EE=0.00669342162296594323;
function outOfMainland(lat,lng){
  if(lng<72.004||lng>137.8347||lat<0.8293||lat>55.8271)return true;   // 不在中國範圍
  if(lng>119.5&&lng<122.6&&lat>21.5&&lat<25.6)return true;            // 台灣用國際坐標
  if(lng>113.8&&lng<114.6&&lat>22.1&&lat<22.7)return true;            // 香港
  if(lng>113.5&&lng<113.7&&lat>22.1&&lat<22.3)return true;            // 澳門
  return false;
}
function _tLat(x,y){let r=-100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*_PI)+20*Math.sin(2*x*_PI))*2/3;r+=(20*Math.sin(y*_PI)+40*Math.sin(y/3*_PI))*2/3;r+=(160*Math.sin(y/12*_PI)+320*Math.sin(y/30*_PI))*2/3;return r}
function _tLon(x,y){let r=300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*_PI)+20*Math.sin(2*x*_PI))*2/3;r+=(20*Math.sin(x*_PI)+40*Math.sin(x/3*_PI))*2/3;r+=(150*Math.sin(x/12*_PI)+300*Math.sin(x/30*_PI))*2/3;return r}
function wgs2gcj(lat,lng){
  if(outOfMainland(lat,lng))return[lat,lng];
  let dLat=_tLat(lng-105,lat-35),dLng=_tLon(lng-105,lat-35);
  const s=Math.sin(lat/180*_PI),m=1-_EE*s*s,sm=Math.sqrt(m);
  dLat=(dLat*180)/((_A*(1-_EE))/(m*sm)*_PI);
  dLng=(dLng*180)/(_A/sm*Math.cos(lat/180*_PI)*_PI);
  return[lat+dLat,lng+dLng];
}
function gcj2wgs(lat,lng){let la=lat,ln=lng;for(let i=0;i<3;i++){const g=wgs2gcj(la,ln);la-=g[0]-lat;ln-=g[1]-lng}return[la,ln]}
const toGCJ=(la,ln)=>TKEY==='amap'?wgs2gcj(la,ln):[la,ln];
const toWGS=(la,ln)=>TKEY==='amap'?gcj2wgs(la,ln):[la,ln];
const hav=(a,b,c,d)=>{const R=6371e3,f=x=>x*Math.PI/180,p=f(a),q=f(c),dp=f(c-a),dl=f(d-b);const h=Math.sin(dp/2)**2+Math.cos(p)*Math.cos(q)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const fmtD=m=>m<1000?Math.round(m/10)*10+' m':(m/1000).toFixed(1)+' km';
const distOf=r=>REF?hav(REF.lat,REF.lng,r.lat,r.lng):null;

/* 多個 Overpass 鏡像「同時」送出，誰先回就用誰 —— 比一個一個試快很多 */
const OVR=[
 'https://overpass-api.de/api/interpreter',
 'https://overpass.kumi.systems/api/interpreter',
 'https://overpass.osm.jp/api/interpreter',
 'https://overpass.private.coffee/api/interpreter',
 'https://overpass.osm.ch/api/interpreter'
];
const OVR_T=28000;
function raceFetch(body,ms){
  return new Promise(res=>{
    const cts=OVR.map(()=>new AbortController());
    let fin=false,bad=0;
    const done=v=>{if(fin)return;fin=true;cts.forEach(c=>{try{c.abort()}catch(_){}});res(v)};
    OVR.forEach((u,i)=>{
      fetch(u,{method:'POST',body,signal:cts[i].signal})
        .then(r=>r.ok?r.json():Promise.reject(new Error('bad')))
        .then(j=>{if(j&&Array.isArray(j.elements)&&j.elements.length)done(j.elements);else if(++bad===OVR.length)done(null)})
        .catch(()=>{if(++bad===OVR.length)done(null)});
    });
    setTimeout(()=>done(null),ms);            // 最壞情況的硬底線
  });
}
async function overpass(lat,lng,r){
  // nwr = 點＋路＋建築都算（很多餐廳在 OSM 是畫成「面」的，只查 node 會漏掉一大半）
  const body=`[out:json][timeout:25];nwr["amenity"~"^(restaurant|cafe|fast_food)$"](around:${r},${lat},${lng});out center tags 150;`;
  return raceFetch(body,OVR_T);
}

  if(!name)return null;

  if(lat==null||lng==null)return null;
  const st=t['addr:street']||t['addr:full']||'',no=t['addr:housenumber']||'';
  const addr=[st,no].filter(Boolean).join('')||t['addr:city']||t['addr:district']||'（地址未提供）';
  const cui=t.cuisine?String(t.cuisine).split(/[;,]/)[0].replace(/_/g,' ').trim():'';
  const am={restaurant:'餐廳',cafe:'咖啡廳',fast_food:'速食小吃'}[t.amenity]||'餐飲';
  const type=cui?cui+'・'+am:am;
  const oh=t.opening_hours?String(t.opening_hours).slice(0,26):'';

    hay:[name,cui,t.amenity,t['cuisine:zh'],t.description,t['name:en'],addr].filter(Boolean).join(' ').toLowerCase(),
    src:'OpenStreetMap 即時資料'};
}

function kwList(){const j=S.a.food[0];return(j==null)?[]:(FOOD_KW[j]||[])}
function matchKW(it,kws){

/* ---- 資料源 1（最準，但要 Key）：高德地圖 Web 服務「周邊搜尋」，用 JSONP 所以沒有跨域問題 ---- */
let AMAP_ERR='';
function jsonp(url,cb,ms){
  return new Promise(res=>{
    const s=document.createElement('script');let done=false;
    const t=setTimeout(()=>fin(null),ms||9000);
    function fin(v){if(done)return;done=true;clearTimeout(t);try{delete window[cb]}catch(_){}try{s.remove()}catch(_){}res(v)}
    window[cb]=d=>fin(d);
    s.onerror=()=>fin(null);
    s.src=url;document.head.appendChild(s);
  });
}
async function amap(lat,lng,kn){
  const key=(localStorage.getItem('amapKey')||'').trim();if(!key)return null;
  const cb='__amap'+(Date.now()%1e7),g=wgs2gcj(lat,lng);
  const u='https://restapi.amap.com/v3/place/around?key='+encodeURIComponent(key)
    +'&location='+g[1].toFixed(6)+','+g[0].toFixed(6)
    +'&keywords='+encodeURIComponent(kn==='餐廳'?'美食':kn)
    +'&types=050000&radius=3000&offset=30&page=1&extensions=all&output=JSON&callback='+cb;
  const d=await jsonp(u,cb,9000);
  if(!d){AMAP_ERR='連不上高德';return null}
  if(d.status!=='1'||!Array.isArray(d.pois)){AMAP_ERR=d.info||'回應格式錯誤';return null}
  AMAP_ERR='';
  const out=[];
  d.pois.forEach(p=>{
    const ll=String(p.location||'').split(',');if(ll.length<2||!p.name)return;
    const w=gcj2wgs(+ll[1],+ll[0]);                 // 高德給的是火星坐標，轉回 WGS84 存
    out.push({name:p.name,lat:w[0],lng:w[1],addr:p.address||'（地址未提供）',
      type:String(p.type||'').split(';').pop()||'餐飲',oh:'',hit:false,d:0,
      meta:'',hay:(p.name+' '+p.type).toLowerCase(),src:'高德地圖'});
  });
  return out;
}

/* 備援資料源：Photon（komoot，同樣吃 OpenStreetMap，但比 Overpass 輕、在中國大陸通常連得上） */
async function photon(lat,lng,terms){
  const out=[];
  for(const q of terms.slice(0,3)){
    try{
      const u='https://photon.komoot.io/api/?q='+encodeURIComponent(q)+'&lat='+lat+'&lon='+lng+'&limit=40&osm_tag=amenity';
      const r=await fetch(u,{signal:AbortSignal.timeout?AbortSignal.timeout(12000):undefined});
      const j=await r.json();
      (j.features||[]).forEach(f=>{
        const p=f.properties||{},c=(f.geometry&&f.geometry.coordinates)||[];
        if(!p.name||c.length<2)return;
        const v=p.osm_value||'';
        if(!/^(restaurant|cafe|fast_food|bar|pub|food_court)$/.test(v))return;
        const d=hav(lat,lng,c[1],c[0]);
        if(d>6000)return;
        const am={restaurant:'餐廳',cafe:'咖啡廳',fast_food:'速食小吃',bar:'餐酒館',pub:'餐酒館',food_court:'美食街'}[v]||'餐飲';
        const addr=[p.district||p.city,p.street,p.housenumber].filter(Boolean).join('')||[p.city,p.state].filter(Boolean).join('')||'（地址未提供）';
        out.push({name:p.name,lat:c[1],lng:c[0],addr,type:am,oh:'',hit:false,d,
          meta:'🍽 '+am,hay:(p.name+' '+v).toLowerCase(),src:'Photon / OpenStreetMap'});
      });
    }catch(_){}
  }
  const seen=new Set();
  return out.filter(x=>{const k=x.name+'|'+x.lat.toFixed(4);if(seen.has(k))return false;seen.add(k);return true});
}

async function liveSearch(lat,lng,label){
  const tk=++SEQ;                             // 新的搜尋會作廢舊的
  BUSY=true;LIVE=null;HITN=0;
  REF={lat,lng};REFNAME=label||'';
  const kws=kwList(),kn=kwName(),t0=Date.now();
  const radii=[900,1800,3200,6000];
  let all=[],hits=[],src='Overpass / OpenStreetMap';
  /* 第一優先：有填高德 Key 就用高德，中國大陸也穩 */
  if((localStorage.getItem('amapKey')||'').trim()){
    setCap(`🔄 用高德地圖找附近的「<b>${esc(kn)}</b>」…`);
    const am=await amap(lat,lng,kn);
    if(tk!==SEQ){BUSY=false;return}
    if(am&&am.length){all=am;hits=all.filter(x=>matchKW(x,kws));src='高德地圖'}
    else if(AMAP_ERR)toast('高德：'+AMAP_ERR+'，改用 OpenStreetMap');
  }
  for(let ri=0;ri<radii.length&&(!all.length||!hits.length);ri++){
    const rad=radii[ri];
    setBar(ri/radii.length);
    setCap(`🔄 第 <b>${ri+1}/${radii.length}</b> 輪：找 ${(rad/1000).toFixed(1)} km 內的「<b>${esc(kn)}</b>」…（${((Date.now()-t0)/1000).toFixed(0)}s）`);
    const els=await overpass(lat,lng,rad);
    if(tk!==SEQ){BUSY=false;return}           // 被更新的搜尋取代
    if(els){
      const seen=new Set();
      all=els.map(toItem).filter(Boolean).filter(x=>{const k=x.name+'|'+x.lat.toFixed(4);if(seen.has(k))return false;seen.add(k);return true});
      hits=all.filter(x=>matchKW(x,kws));
    }
    if(hits.length>=10)break;                 // 夠多了就停
    if(ri===radii.length-1)break;
    if(hits.length>=5&&all.length>=60)break;  // 密度夠高也停
  }
  if(tk!==SEQ){BUSY=false;return}
  if(!all.length||!hits.length){               // 主要來源不給力 → 換 Photon 再找一次
    setCap(`🔄 主要資料庫沒回應，換一個來源再試…（${((Date.now()-t0)/1000).toFixed(0)}s）`);
    const ph=await photon(lat,lng,[kn].concat(kws.filter(k=>!/[\u4e00-\u9fa5]/.test(k)).slice(0,2),['restaurant']));
    if(tk!==SEQ){BUSY=false;return}
    if(ph.length){
      const seen=new Set(all.map(x=>x.name+'|'+x.lat.toFixed(4)));
      all=all.concat(ph.filter(x=>!seen.has(x.name+'|'+x.lat.toFixed(4))));
      hits=all.filter(x=>matchKW(x,kws));src='Photon / OpenStreetMap';
    }
  }
  BUSY=false;setBar(1);
  if(tk!==SEQ)return;
  if(!all.length){
    LIVE=null;HITN=0;draw(rlist());setBar(null);
    setCap('⚠️ 這一區沒抓到餐廳（網路或資料庫忙碌）。請按「📡 重新定位」一次，或在下面輸入地區按 🔎 去這裡。');return;
  }
  all.forEach(x=>{x.d=x.d||hav(lat,lng,x.lat,x.lng)});
  all.sort((a,b)=>a.d-b.d);
  hits=all.filter(x=>matchKW(x,kws));
  let list=hits.slice(0,14);
  const left=[];
  if(list.length<6){                          // 符合的太少，補其他餐廳墊在後面
    const inList=new Set(list);
    for(const x of all){if(!inList.has(x)&&left.length<12-list.length)left.push(x)}
  }
  const out=list.concat(left);
  out.forEach((x,i)=>{x.hit=i<list.length});
  HITN=list.length;LIVE=out;draw(LIVE);setBar(null);
  const far=fmtD(out[out.length-1].d),sec=((Date.now()-t0)/1000).toFixed(1);
  if(list.length)setCap(`✅ 花了 <b>${sec}</b> 秒，<b>${far}</b> 內找到 <b>${out.length}</b> 家，其中 <b>${list.length}</b> 家符合「<b>${esc(kn)}</b>」，由近到遠排序。資料來源：${src}。`);
  else setCap(`✅ 附近 <b>${far}</b> 內共 ${out.length} 家餐廳，但沒有完全符合「${esc(kn)}」的，下面列出最接近的選擇。資料來源：${src}。`);
  say(list.length?`找到 ${list.length} 家「${kn}」囉～`:'這區沒那麼剛好的店，先看看附近有什麼吧');
}
/* --- 定位：GPS → IP → 預設 --- */
function ipGeo(){
  const apis=[
    {u:'https://ipwho.is/',p:j=>j&&j.success?{lat:+j.latitude,lng:+j.longitude,n:[j.city,j.region].filter(Boolean).join('・')}:null},
    {u:'https://get.geojs.io/v1/ip/geo.json',p:j=>j&&j.latitude?{lat:+j.latitude,lng:+j.longitude,n:[j.city,j.region].filter(Boolean).join('・')}:null},
    {u:'https://ipinfo.io/json',p:j=>j&&j.loc?{lat:+j.loc.split(',')[0],lng:+j.loc.split(',')[1],n:[j.city,j.region].filter(Boolean).join('・')}:null}
  ];
  return (async()=>{for(const a of apis){try{const r=await fetch(a.u,{cache:'no-store'});const g=a.p(await r.json());if(g&&isFinite(g.lat)&&isFinite(g.lng))return g}catch(_){}}return null})();
}
function gps(){
  return new Promise(res=>{
    if(!navigator.geolocation)return res(null);
    navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,n:'我的位置',gps:true}),
      ()=>res(null),{timeout:8000,enableHighAccuracy:false,maximumAge:60000});
  });
}

}
async function locateFlow(force){
  if(MY&&!force){const g=toGCJ(MY.lat,MY.lng);MAP&&MAP.setView(g,16);putMe();liveSearch(MY.lat,MY.lng,'我附近');return}
  setCap('📡 定位中…（允許定位才能抓你附近的店）');
  const p=await gps();
  if(p){MY={lat:p.lat,lng:p.lng};REF={lat:p.lat,lng:p.lng};const g=toGCJ(p.lat,p.lng);MAP&&MAP.setView(g,16);putMe();say('定位成功！幫你找附近的店 💕');liveSearch(p.lat,p.lng,'我附近');return}
  setCap('🌐 定位沒開，改用 IP 大致定位…');
  const ip=await ipGeo();
  if(ip){const g=toGCJ(ip.lat,ip.lng);MAP&&MAP.setView(g,14);setCap('🌐 依 IP 判斷你在 '+esc(ip.n||'')+'，誤差較大，建議按「📡 重新定位」或拖動地圖。');liveSearch(ip.lat,ip.lng,ip.n||'附近');return}
  const g=toGCJ(DEF.lat,DEF.lng);MAP&&MAP.setView(g,DEF.z);
  setCap('⚠️ 無法定位。請在下面輸入地區（例如「台北 信義區」）後按 🔎 去這裡，或直接拖動地圖再按「🔄 搜尋這一區」。');
  draw(rlist());
}

/* ---------- 示意地圖（備援 / 載入中） ---------- */
function mapSvg(L){
  const la=L.map(r=>r.lat),ln=L.map(r=>r.lng),a=Math.min(...la),b=Math.max(...la),c=Math.min(...ln),d=Math.max(...ln),P=[];
  L.forEach((r,k)=>{let x=30+(r.lng-c)/((d-c)||1)*260,y=170-(r.lat-a)/((b-a)||1)*140;
    P.slice(0,k).forEach(q=>{if(Math.hypot(q[0]-x,q[1]-y)<22){x+=20;y-=12}});P.push([x,y])});
  return `<svg viewBox="0 0 320 200" role="img" aria-label="餐廳位置示意地圖"><rect class="mapbg" width="320" height="200"/><ellipse class="pk" cx="250" cy="150" rx="60" ry="32"/><ellipse class="pk" cx="60" cy="50" rx="46" ry="24"/><path class="rd" d="M-10 120 C80 70 160 150 330 60"/><path class="rd" d="M120 -10 C140 80 90 140 150 210"/>${P.map((q,k)=>`<g class="pin" data-j="${k}" transform="translate(${q[0].toFixed(1)} ${q[1].toFixed(1)})"><circle r="14"/><text>${k+1}</text></g>`).join('')}</svg>`;
}

/* ---------- 清單 / 圖釘 繪製 ---------- */
function rbHtml(L,off){
  return L.map((r,k)=>{
    const i=off+k,d=r.d||distOf(r);
    const fromMe=!!(REF&&MY&&Math.abs(REF.lat-MY.lat)<1e-7&&Math.abs(REF.lng-MY.lng)<1e-7);
    const tags=[];
    if(d!=null)tags.push(`<em class="db">${fromMe?'距你':'距離'} ${fmtD(d)}</em>`);
    if(r.type)tags.push(`<em class="tb">🍽 ${esc(r.type)}</em>`);
    if(r.hit)tags.push(`<em class="hitb">✓ 符合</em>`);
    if(r.price)tags.push(`<em class="db">${esc(r.price)}</em>`);
    else if(r.meta)tags.push(`<em>${esc(r.meta)}</em>`);
    if(r.oh)tags.push(`<em class="oh">🕒 ${esc(r.oh)}</em>`);
    return `<button class="ri${r.hit?' hit':''}" data-j="${i}"><b class="no">${i+1}</b><span class="rn">${esc(r.name)}</span><span class="tags">${tags.join('')}</span><small>📍 ${esc(r.addr)}</small></button>`;
  }).join('');
}
function draw(L){
  const box=$('#rlbox');
  if(box){
    const live=!!(LIVE&&LIVE.length),n=live?Math.min(HITN,L.length):0;
    const a=L.slice(0,n),b=L.slice(n);
    let h='';
    if(a.length)h+=`<p class="grp">✅ 符合「${esc(kwName())}」— ${a.length} 家，由近到遠</p><div class="rl">${rbHtml(a,0)}</div>`;
    if(b.length)h+=`<p class="grp" style="margin-top:16px">${a.length?'🍽 附近其他餐廳':'📋 餐廳清單'} — ${b.length} 家</p><div class="rl">${rbHtml(b,a.length)}</div>`;
    box.innerHTML=h||'<p class="cap">還沒找到店家，按上面的按鈕再試一次。</p>';
  }
  const s=$('#sum');
  if(s){
    const n=Math.min(HITN,L.length),live=!!(LIVE&&LIVE.length);
    s.innerHTML=live?`<span class="g">🔍 ${esc(kwName())}</span><span>✅ 符合 ${n} 家</span><span class="p">🍽 共 ${L.length} 家</span>`+(MY?'<span class="p">📍 以你的位置為準</span>':''):'';
  }
  if(MAP&&LF)drawPins(L);
  paintRest();
}
function drawPins(L){
  MK.forEach(m=>{try{MAP.removeLayer(m)}catch(_){}});MK=[];
  MK=L.map((r,i)=>{
    const g=toGCJ(r.lat,r.lng);
    const m=LF.marker(g,{icon:LF.divIcon({className:'',html:`<div class="numpin" data-j="${i}">${i+1}</div>`,iconSize:[28,28],iconAnchor:[14,14],popupAnchor:[0,-16]}),title:r.name}).addTo(MAP);
    const d=distOf(r);
    m.bindPopup(`<b>${esc(r.name)}</b><br>${esc(r.meta)}${d!=null?'<br>距離 '+fmtD(d):''}<br>📍 ${esc(r.addr)}`);
    m.on('click',()=>selectRest(i));
    return m;
  });
  fit();
}
function fit(){
  if(!MAP||!LF)return;const L=rlist();
  if(L.length>1){try{MAP.fitBounds(LF.latLngBounds(L.map(r=>toGCJ(r.lat,r.lng))),{padding:[34,34],maxZoom:16})}catch(_){}}
  else if(L.length===1){const g=toGCJ(L[0].lat,L[0].lng);MAP.setView(g,16)}
}
function paintRest(){
  const k=rlist().findIndex(r=>r.name===S.rest);
  document.querySelectorAll('.ri,.pin').forEach(e=>e.classList.toggle('on',+e.dataset.j===k));
  MK.forEach((m,i)=>{const el=m.getElement();if(el){const p=el.querySelector('.numpin');if(p)p.classList.toggle('on',i===k)}});
  const sel=$('#sel');
  if(sel){
    if(k<0)sel.innerHTML='';
    else{const L=rlist(),q=encodeURIComponent(L[k].name+' '+L[k].addr);
      sel.innerHTML=`已選：<b>${esc(L[k].name)}</b> ・ <a href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener noreferrer">在 Google 地圖開啟</a> ・ <a href="https://uri.amap.com/search?keyword=${q}" target="_blank" rel="noopener noreferrer">高德地圖</a>`}
  }
}
function selectRest(i){
  const r=rlist()[i];if(!r)return;
  S.rest=r.name;S.restAddr=r.addr;
  const inp=$('#rs');if(inp)inp.value=r.name;
  paintRest();$('#next').disabled=!ok();
  const b=$('#lmap');const rc=b?b.getBoundingClientRect():{left:innerWidth/2,top:300,width:0,height:0};
  fx(rc.left+rc.width/2,rc.top+40,['💗','🍴','✨']);say(pick(CHEER)+'「'+r.name+'」');
  if(MAP){try{const g=toGCJ(r.lat,r.lng);MAP.setView(g,17);MK[i]&&MK[i].openPopup()}catch(_){}}
}

function setTile(k){
  if(!MAP||!LF)return;const T=TILES[k]||TILES.osm;
  let c=MAP.getCenter?MAP.getCenter():null;
  if(c&&TKEY!==k)c=LF.latLng(...toWGS(c.lat,c.lng));   // 換圖磚時先把中心轉回 WGS84
  TKEY=k;
  if(TILE){try{MAP.removeLayer(TILE)}catch(_){}}
  TILE=LF.tileLayer(T.url,{maxZoom:T.max,subdomains:T.sub,attribution:T.attr}).addTo(MAP);
  if(c)MAP.setView(toGCJ(c.lat,c.lng),MAP.getZoom());
  let err=0;
  TILE.on('tileerror',()=>{if(++err>6&&TKEY==='amap'){toast('高德圖磚連不上，自動切換 OpenStreetMap');setTile('osm')}});
  const b=$('#tileb');if(b)b.textContent='🗺 圖磚：'+T.name;
  draw(rlist());
}
async function mountMap(){
  const box=$('#lmap');if(!box||box.dataset.on==='1')return;
  const base=rlist();
  if(MAP){try{MAP.remove()}catch(_){}}MAP=null;MK=[];TILE=null;   // 重進這一步時清掉舊地圖
  try{
    LF=await loadLeaflet();
    if(box.dataset.on==='1')return;
    box.dataset.on='1';box.innerHTML='';
    const c0=(MY||(base[0]?{lat:base[0].lat,lng:base[0].lng}:DEF));
    MAP=LF.map(box,{zoomControl:true,attributionControl:true,scrollWheelZoom:false}).setView(toGCJ(c0.lat,c0.lng),DEF.z);
    setTile(TKEY);
    drawPins(base);
    const rb=$('#rlbox');if(rb&&!(LIVE&&LIVE.length))rb.innerHTML='';   // 定位完成前先不顯示備用清單
    locateFlow(false);
  }catch(_){
    const c=$('#mcap');if(c)c.innerHTML='⚠️ 即時地圖載入失敗（網路限制），改用示意地圖；下面的店家座標仍是真實的。';
    draw(base);
  }
}

/* ================= 主流程 ================= */
function grid(){
  const s=STEPS[S.i];
  $('#grid').innerHTML=s.o.map((o,j)=>`<button class="opt c${j%4}${S.a[s.k].includes(j)?' on':''}" data-j="${j}"><i>${o[0]}</i><b>${o[1]}</b><small>${o[2]}</small></button>`).join('');
  $('#next').disabled=!ok();
}
function render(){
  const s=STEPS[S.i];
  view='pick';$('#nav').hidden=false;$('#grid').className='grid';$('#q').textContent=s.ico+' '+s.q;
  $('#hint').textContent=s.h||(s.max>1?`最多可以選 ${s.max} 個`:'點一下就選好囉');
  $('#extra').innerHTML=s.date?`<label class="dt">📅 或直接挑日子：<input type="date" id="dt" value="${S.date}"></label>`:s.rest?restUI():'';
  $('#prog').innerHTML=STEPS.map((_,i)=>`<span class="${i<S.i?'done':i===S.i?'cur':''}">${i<S.i?'♥':'♡'}</span>`).join('');
  $('#next').textContent=S.i===STEPS.length-1?'看結果':'下一步';
  $('#prev').style.visibility=S.i?'visible':'hidden';
  grid();say(s.say);
  if(s.rest){LIVE=null;HITN=0;const b=$('#lmap');if(b)b.dataset.on='';paintRest();mountMap()}
  const p=$('#panel');p.classList.remove('in');void p.offsetWidth;p.classList.add('in');
}

document.addEventListener('click',e=>{
  const b=e.target.closest('.opt');if(!b)return;
  const s=STEPS[S.i],j=+b.dataset.j,a=S.a[s.k];
  if(s.max===1)S.a[s.k]=[j];
  else if(a.includes(j))a.splice(a.indexOf(j),1);
  else{if(a.length>=s.max){a.shift();toast(`最多 ${s.max} 個，幫你換掉最早選的`)}a.push(j)}
  grid();fx(e.clientX,e.clientY,['💗','✨','🌸','💕']);
  if(s.k==='food'){S.rest='';S.restAddr='';LIVE=null;HITN=0}   // 換了想吃什麼，重抓餐廳
  if(S.a[s.k].includes(j))say(pick(CHEER)+'「'+s.o[j][1]+'」');
});
document.addEventListener('click',e=>{
  const t=e.target.closest('.ri,.pin');if(!t)return;
  selectRest(+t.dataset.j);
});
document.addEventListener('click',e=>{

        else setCap('找到 '+esc(j[0].display_name.slice(0,40))+'，但地圖尚未就緒。');

document.addEventListener('change',e=>{if(e.target.id==='dt'){S.date=e.target.value;$('#next').disabled=!ok();if(S.date)say('這天我會空出來等你！')}});

/* ================= 結果券 ================= */
function clean(d){
  if(!d||typeof d!=='object')return null;
  const a={};STEPS.forEach(s=>{const v=d.a&&d.a[s.k];a[s.k]=Array.isArray(v)?v.filter(j=>Number.isInteger(j)&&j>=0&&j<s.o.length).slice(0,s.max):[]});
  return{a,date:/^\d{4}-\d\d-\d\d$/.test(d.date)?d.date:'',rest:String(d.rest||'').slice(0,40),addr:String(d.addr||'').slice(0,80),at:+d.at||0,ack:!!d.ack,ackAt:+d.ackAt||0};
}
function rows(p){
  const L=k=>p.a[k].map(j=>{const o=STEPS.find(s=>s.k===k).o[j];return o[0]+o[1]}).join('、');
  const food=[L('food'),p.rest&&'店名：'+p.rest+(p.addr?'（📍 '+p.addr+'）':''),L('rest')&&'（'+L('rest')+'）'].filter(Boolean).join(' ');
  return[['類型',L('type')],['時間',((p.date?p.date+' ':'')+L('day')+' '+L('time')).trim()],['地點',L('place')],['餐廳',food],['活動',L('act')],['小驚喜',L('gift')]];
}
const ticket=p=>`<div class="ticket"><div class="tt">💌 專屬約會券</div><dl>${rows(p).map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1]||'還沒選～')}</dd>`).join('')}</dl><p class="fine">有效期限：永遠永遠。不可退換，只能珍藏。</p></div>`;
async function copyText(p){
  const t='💌 約會選擇結果\n'+rows(p).map(r=>r[0]+'：'+(r[1]||'未選')).join('\n')+'\n\n請準時赴約，不可以遲到喔！\n\n點開看看：'+location.href.split('#')[0]+'#r='+encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(p)))));

}
const dirty=()=>S.i>0||S.date||S.rest||STEPS.some(s=>S.a[s.k].length);
const hearts=()=>{$('#prog').innerHTML=STEPS.map(()=>'<span class="done">♥</span>').join('');$('#nav').hidden=true;$('#extra').innerHTML='';$('#grid').className=''};

  $('#grid').innerHTML=ticket(clean(draft()))+`<div class="ans"><button class="btn main" id="yes">好呀！就這樣約會 💕</button><button class="btn" id="no">不想去…</button></div><div class="tools"><button class="btn" id="again">重新選</button></div>`;
  say('確認一下，這樣的約會可以嗎？');
  const yes=$('#yes'),no=$('#no');let n=0;
  yes.onclick=submit;
  const dodge=e=>{
    if(n>=4){no.textContent='好啦好啦，我去 💦';no.onclick=submit;return}
    e.preventDefault();n++;
    no.style.transform=`translate(${(Math.random()-.5)*150}px,${(Math.random()-.5)*50}px) rotate(${(Math.random()-.5)*20}deg)`;
    say(['哎呀，按不到～','再試一次？','它自己跑掉了耶','這個按鈕不想被按！'][n-1]);
    if(n>=4)no.textContent='好啦好啦，我去 💦';
  };
  no.addEventListener('pointerenter',dodge);no.addEventListener('pointerdown',dodge);
  $('#again').onclick=()=>{const pv=S.preview;PLAN=null;S.preview=pv;resetMenu()};
}
const draft=()=>({a:S.a,date:S.date,rest:S.rest.trim(),addr:S.restAddr,at:Date.now(),ack:false,ackAt:0});
async function submit(e){
  const p=clean(draft()),r=e.target.getBoundingClientRect();
  fx(r.left+r.width/2,r.top,['💖','🎉','🌸','✨','💕'],22);
  if(S.preview){PLAN=p;return showResult('preview')}
  if(DB){try{await DB.doc('plan/main').set(p);PLAN=p;return showResult('live')}catch(_){}}
  PLAN=p;showResult('local');
}
function showResult(mode){
  const p=PLAN,live=mode==='live';view='result';hearts();
  const t=p.at?new Date(p.at).toLocaleString('zh-Hant',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
  $('#q').textContent=mode==='link'?'💌 她選好啦！':mode==='preview'?'👀 她會看到這樣的結果':live&&OWNER?'💌 她選好啦！':live?'✅ 已經送出給他囉':'🎉 約會計畫完成！';
  $('#hint').textContent=mode==='link'?'這是她傳給你的選擇結果':mode==='preview'?'預覽模式，不會真的送出':live?`她在 ${t} 完成了選擇`:'這頁沒辦法自動通知他，請按下面的按鈕傳給他';
  const st=live?`<div class="st"><span class="chip ok">她已完成 ✓</span><span class="chip${p.ack?' ok':''}">${p.ack?'他已收到 ✓':'他還沒回應 ⏳'}</span></div>`:'';
  const act=live?(OWNER&&!p.ack?'<button class="btn main" id="ack">收到！我來安排 💪</button>':`<p class="fine">${p.ack?'他已經收到，約會準備中 💗':'已通知他，等他回應吧 💗'}</p>`):'';
  $('#grid').innerHTML=st+ticket(p)+(act?`<div class="ans">${act}</div>`:'')+`<div class="tools"><button class="btn" id="cp">${live?'複製結果':'傳給他（複製）'}</button><button class="btn" id="again">${mode==='preview'?'返回':OWNER?'讓她重選':'我要改選'}</button></div>`;
  say(live?(OWNER?(p.ack?'你已經回應她了，期待約會！':'她等你回應喔，快按收到～'):(p.ack?'他收到了！':'已經通知他囉，等他回應～')):'好了～');
  $('#cp').onclick=()=>copyText(p);
  const ack=$('#ack');
  if(ack)ack.onclick=async e=>{try{await DB.doc('plan/main').update({ack:true,ackAt:Date.now()});PLAN={...PLAN,ack:true};fx(e.clientX,e.clientY,['💪','💖','🎉'],16);showResult('live')}catch(_){toast('回應失敗，再試一次')}};
  $('#again').onclick=async()=>{
    if(mode==='preview'){S.preview=false;return home()}
    if(live&&DB){try{await DB.doc('plan/main').delete()}catch(_){return toast('重選失敗，再試一次')}}
    PLAN=null;resetMenu();
  };
}
function route(had){
  if(S.preview)return;
  if(PLAN){
    if(!had&&OWNER&&view!=='review'){toast('💌 她選好啦！快來看結果');fx(innerWidth/2,innerHeight/3,['💖','🎉','🌸','✨'],24)}
    else if(had&&!had.ack&&PLAN.ack&&!OWNER)toast('💗 他已收到，準備約會囉');
    showResult('live');
  }else if(view==='result')reset();
  else if(view==='pick'&&OWNER&&!dirty())waiting();
}
function onSnap(snap){
  const p=snap.exists?clean(snap.data()):null,same=inited&&JSON.stringify(p)===JSON.stringify(PLAN);
  inited=true;if(same)return;
  const had=PLAN;PLAN=p;route(had);
}
(async()=>{try{
  if(!window.claude)return;
  const u=await claude.use('user');OWNER=u?await u.isOwner():false;
  DB=await claude.use('db');if(!DB)return;
  DB.doc('plan/main').onSnapshot(onSnap,()=>{});
}catch(_){}})();
$('#grid').className='grid';
let LM=false;
try{const m=location.hash.match(/^#r=(.+)$/);if(m){const p=clean(JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1]))))));if(p){PLAN=p;OWNER=true;showResult('link');LM=true}}}catch(_){}
if(!LM)render();
</script>
</body>
</html>
